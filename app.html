  <noscript>
    <p style="text-align:center;padding:16px;font-size:13px;color:#666;font-family:sans-serif;">
      PitchRank'ı kullanmak için tarayıcınızda JavaScript'i etkinleştirin.
    </p>
  </noscript>

  <!-- ?team= parametresini sessionStorage'a yaz; type=module importlarından ÖNCE çalışmalı -->
  <script>
  (function() {
    var t = new URL(location.href).searchParams.get('team');
    if (t === 'haldunalagas' || t === 'arion') {
      sessionStorage.setItem('pitchrank_selected_team', t);
      history.replaceState(null, '', location.pathname);
    }
  }());
  </script>
  <script type="module" src="js/boot.js?v=3.1"></script>
</body>
