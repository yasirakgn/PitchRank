  <style>
    #verify-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #0d0d12;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #verify-overlay.verify-exit { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #verify-card {
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 36px 24px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    }
    .verify-emoji { font-size: 52px; margin-bottom: 20px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(255,200,0,0.4)); }
    .verify-q { font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.4px; margin-bottom: 8px; line-height: 1.3; }
    .verify-sub { font-family: Inter, system-ui, sans-serif; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 28px; }
    #verify-opts { display: flex; flex-direction: column; gap: 10px; }
    .verify-btn {
      font-family: Inter, system-ui, sans-serif;
      font-size: 15px; font-weight: 700;
      padding: 15px 20px;
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .verify-btn:active { transform: scale(0.97); }
    .verify-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
    .verify-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); animation: vShake 0.4s ease; }
    .verify-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.18); }
    #verify-msg { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #ef4444; min-height: 20px; margin-top: 16px; }
    @keyframes vShake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
  </style>
  <!-- Structured Data for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "PitchRank",
    "description": "Halı saha ve futsal maçları için profesyonel oyuncu performans değerlendirme, puanlama ve istatistik takip sistemi.",
    "url": "https://pitchrank.app/",
    "applicationCategory": "SportsApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.5",
      "ratingCount": "100"
    }
  }
  </script>

<body class="dark">
  <!-- Doğrulama Kapısı -->
  <div id="verify-overlay">
    <div id="verify-card">
      <div class="verify-emoji">⚽</div>
      <div class="verify-q">Hangisi daha ağırdır?</div>
      <div class="verify-sub">1 kilo pamuk mu, 1 kilo demir mi?</div>
      <div id="verify-opts">
        <button class="verify-btn" onclick="verifyPick(this,false)" type="button">⚙️&nbsp; 1 kg demir</button>
        <button class="verify-btn" onclick="verifyPick(this,false)" type="button">🧸&nbsp; 1 kg pamuk</button>
        <button class="verify-btn" onclick="verifyPick(this,true)"  type="button">⚖️&nbsp; İkisi de eşittir</button>
      </div>
      <div id="verify-msg"></div>
    </div>
  </div>
  <script>
    if (sessionStorage.getItem('pitchrank_verified')) {
      document.getElementById('verify-overlay').style.display = 'none';
    }
    function verifyPick(btn, correct) {
      document.querySelectorAll('.verify-btn').forEach(function(b) { b.classList.remove('wrong','correct'); });
      if (correct) {
        btn.classList.add('correct');
        sessionStorage.setItem('pitchrank_verified', '1');
        var overlay = document.getElementById('verify-overlay');
        overlay.classList.add('verify-exit');
        setTimeout(function() { overlay.style.display = 'none'; }, 520);
      } else {
        btn.classList.add('wrong');
        document.getElementById('verify-msg').textContent = 'Yanlış! Bir daha dene 😄';
      }
    }
  </script>
